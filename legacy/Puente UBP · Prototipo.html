<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puente UBP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#8f1525;--blue:#bd1e35;--cyan:#e34d5f;--ink:#292929;--muted:#6d6d6d;--line:#e6e6e6;--bg:#f7f7f7;--card:#fff;--soft:#fff0f2;--green:#167452;--greenbg:#e3f5ed;--amber:#956000;--amberbg:#fff3dc;--red:#b93232}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}.app{max-width:1080px;margin:auto;padding:0 26px 54px}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:46px;height:46px;display:grid;place-items:center;color:white;background:var(--blue);border-radius:12px;font:800 14px "Plus Jakarta Sans"}.brand h1{font:800 19px "Plus Jakarta Sans";margin:0;color:var(--navy)}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.top-note{color:var(--blue);font-size:13px;font-weight:600}
.hero{background:linear-gradient(110deg,#102b50 0%,#155d91 60%,#35aeba 100%);border-radius:24px;padding:30px;color:white;display:flex;justify-content:space-between;gap:28px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;border:28px solid rgba(255,255,255,.08);right:-70px;top:-90px}.hero h2{font:800 29px/1.15 "Plus Jakarta Sans";margin:0 0 9px;max-width:570px}.hero p{margin:0;max-width:580px;color:#e6f6fa}.hero-stats{display:flex;gap:25px;align-items:end;position:relative;z-index:1}.hero-stats b{display:block;font:800 27px "Plus Jakarta Sans"}.hero-stats span{font-size:12px;color:#d7edf2}
.notice{display:flex;gap:10px;align-items:center;padding:12px 15px;background:var(--amberbg);color:var(--amber);border:1px solid #f1dfb5;border-radius:12px;margin:18px 0;font-size:13px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:5px 0 24px}.tabs button{border:0;background:none;color:var(--muted);font:600 14px "DM Sans";padding:13px 15px;cursor:pointer;border-bottom:3px solid transparent}.tabs button[aria-selected=true]{color:var(--blue);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.75fr);gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;margin-bottom:16px;box-shadow:0 4px 16px rgba(22,55,84,.04)}h2{font:700 18px "Plus Jakarta Sans";margin:0 0 5px}h3{font-weight:700;font-size:15px;margin:0}.muted{color:var(--muted);font-size:13px}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;margin:0 0 6px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:10px 16px;font:600 14px "DM Sans";cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.secondary{background:transparent;color:var(--blue)}.btn.ghost{border-color:var(--line);background:#fff;color:var(--muted)}.btn.small{padding:7px 11px;font-size:13px}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #9bdce5;outline-offset:2px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.quick div{background:var(--soft);border-radius:13px;padding:13px}.quick b{display:block;color:var(--navy);font-size:19px}.quick span{font-size:12px;color:var(--muted)}
label.field{display:block;font-weight:600;font-size:13px;margin:17px 0 7px}select,input[type=text],textarea{font:15px "DM Sans";width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:8px 12px;cursor:pointer;font:500 13px "DM Sans"}.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}.upload{border:1px dashed #9cb8c7;border-radius:12px;padding:14px;background:#f9fcfd}.upload input{font-size:13px;width:100%;margin-top:7px}.check{display:flex;gap:9px;margin-top:16px;font-size:13px;color:var(--muted)}.check input{accent-color:var(--blue);margin-top:4px}.error{color:var(--red);font-size:13px;margin-top:10px}
.tag{display:inline-flex;align-items:center;background:var(--soft);color:var(--blue);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:600}.tag.green{background:var(--greenbg);color:var(--green)}.tag.amber{background:var(--amberbg);color:var(--amber)}.needs{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.request{border-left:4px solid var(--cyan)}.kv{display:grid;grid-template-columns:115px 1fr;gap:6px 10px;margin:15px 0;font-size:13px}.kv span:nth-child(odd){color:var(--muted)}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.profile{display:flex;gap:14px;align-items:center}.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#d9f2f3;color:var(--blue);font-weight:800;font-size:17px}.profile h3{font-size:16px}.profile p{margin:2px 0;color:var(--muted);font-size:13px}.file-name{margin:7px 0 0;font-size:12px;color:var(--green)}.slot{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:9px 11px;border-radius:10px;margin-top:7px;cursor:pointer}.steps{display:flex;gap:4px;margin:14px 0 5px}.steps i{height:5px;border-radius:5px;background:var(--line);flex:1}.steps i.done{background:var(--cyan)}.steps-label{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{display:block;font:800 22px "Plus Jakarta Sans";color:var(--navy)}.metric span{font-size:11px;color:var(--muted)}.bar{height:7px;flex:1;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}.footer{text-align:center;margin-top:20px}
@media(max-width:780px){.hero{display:block}.hero-stats{margin-top:20px}.grid{grid-template-columns:1fr}}@media(max-width:520px){.app{padding:0 14px 40px}.top-note{display:none}.hero{padding:23px 20px}.hero h2{font-size:24px}.quick,.metric{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}.tabs{overflow:auto}.tabs button{white-space:nowrap;padding:12px 10px}}
.app{max-width:1240px;padding:0 32px 54px}.site-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}.site-header .brand{min-width:225px}.header-context{color:var(--muted);font-size:13px;text-align:right}.header-context strong{display:block;color:var(--ink);font-size:14px}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;padding-top:28px}.sidebar{border-right:1px solid var(--line);padding-right:22px;min-height:calc(100vh - 115px)}.sidebar-label{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:6px 12px 10px}.side-nav{display:grid;gap:6px}.side-nav button{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:11px 12px;text-align:left;font:600 13px "DM Sans";cursor:pointer}.side-nav button:hover{background:var(--soft);color:var(--blue)}.side-nav button[aria-selected=true]{background:var(--soft);color:var(--blue);box-shadow:inset 3px 0 var(--blue)}.side-nav small{display:block;font-weight:400;color:inherit;opacity:.75;margin-top:2px}.sidebar-help{border-top:1px solid var(--line);margin-top:28px;padding:18px 12px;color:var(--muted);font-size:12px}.sidebar-help strong{color:var(--ink);display:block;margin-bottom:4px}.main-content{min-width:0}.page-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.page-intro h2{font-size:25px;margin:0}.page-intro p{margin:5px 0 0;color:var(--muted);max-width:620px}.page-intro .eyebrow{margin-bottom:5px}.page-actions{display:flex;gap:8px;flex-shrink:0}.section-heading{display:flex;justify-content:space-between;align-items:center;margin:28px 0 11px}.section-heading h2{margin:0}.hero{background:var(--navy);border-radius:16px;padding:24px 26px}.hero:after{border-color:rgba(255,255,255,.07)}.hero h2{font-size:24px}.notice{margin:0 0 22px}.card{border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.035);padding:20px}.btn{border-radius:8px;background:var(--blue);border-color:var(--blue)}.btn.secondary{color:var(--blue)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline-color:#f19aa5}.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}.quick div{background:var(--soft)}.request{border-left-color:var(--blue)}.steps i.done,.bar i{background:var(--blue)}.avatar{background:var(--soft);color:var(--blue)}
@media(max-width:820px){.app{padding:0 18px 42px}.workspace{grid-template-columns:1fr;gap:20px}.sidebar{border-right:0;border-bottom:1px solid var(--line);min-height:auto;padding:0 0 16px}.side-nav{display:flex;overflow:auto}.side-nav button{white-space:nowrap}.side-nav small{display:none}.sidebar-help{display:none}.page-intro{align-items:flex-start;flex-direction:column}.page-actions{width:100%}}
@media(max-width:520px){.site-header{padding:16px 0}.header-context{display:none}.page-intro h2{font-size:22px}.workspace{padding-top:18px}.app{padding-left:14px;padding-right:14px}}
</style>
</head>
<body><main class="app" id="app"></main>
<script>
const CAREERS=['Abogacía','Arquitectura','Contador Público','Diseño Gráfico','Diseño y Animación Digital','Gestión Ambiental','Gestión Empresarial','Ingeniería Informática','Licenciatura en Administración','Marketing','Publicidad','Relaciones Internacionales','Turismo'];
const NEEDS=['Orientación de carrera','Revisar mi CV','Simular una entrevista','Conocer el rubro','Buscar una práctica','Armar mi portfolio'];
const PERIODS=['1 semana','2 semanas','3 semanas','4 semanas'],SLOTS=['Mié 14/10 · 18:00','Vie 16/10 · 19:00','Mar 20/10 · 18:30'];
const AF={'Publicidad':'c','Comunicación Audiovisual':'c','Marketing':'c','Diseño Gráfico':'c','Diseño y Animación Digital':'c','Contador Público':'n','Gestión Empresarial':'n','Licenciatura en Administración':'n','Ingeniería Informática':'t','Turismo':'t','Gestión Ambiental':'a','Abogacía':'j','Relaciones Internacionales':'j','Arquitectura':'a'};
const ME={nombre:'Martina Gómez',car:'Publicidad'},EGR=6;
let S;
function init(){S={role:'est',view:'home',err:'',nid:103,rates:[5,4,5],profile:{nombre:'Sofía Ferraro',car:'Publicidad',rol:'Planner en agencia',lug:'Madrid, España',bio:'Me especializo en estrategia, campañas y crecimiento de marcas.',topics:['Revisar mi CV','Conocer el rubro'],file:''},mentors:[
{id:1,n:'Marcos Ruiz',car:'Comunicación Audiovisual',rol:'Director de productora',lug:'Córdoba',t:[0,2,3],cupo:1,us:0,on:1},
{id:2,n:'Lucía Paz',car:'Contador Público',rol:'Auditora senior',lug:'Buenos Aires',t:[1,2,4],cupo:2,us:1,on:1},
{id:3,n:'Andrés Soto',car:'Gestión Empresarial',rol:'Consultor',lug:'Mendoza',t:[0,4,3],cupo:1,us:0,on:1},
{id:4,n:'Carla Medina',car:'Abogacía',rol:'Abogada en estudio jurídico',lug:'Rosario',t:[0,1,2],cupo:1,us:1,on:1},
{id:5,n:'Julián Vega',car:'Turismo',rol:'Gerente de hotel',lug:'Salta',t:[3,0],cupo:2,us:1,on:1},
{id:6,n:'Sofía Ferraro',car:'Publicidad',rol:'Planner en agencia',lug:'Madrid, España',t:[1,3,0],cupo:1,us:1,on:1},
{id:7,n:'Ignacio Bruno',car:'Relaciones Internacionales',rol:'Analista de comercio exterior',lug:'Buenos Aires',t:[0,3],cupo:1,us:0,on:1}],
reqs:[{id:101,al:'Tomás Herrera',car:'Contador Público',needs:[2],ctx:'Tengo una entrevista para una pasantía en una consultora y quiero practicar.',disp:'Lun a jue por la tarde',period:1,st:'pend',m:null,slot:null,ex:[],d:3},{id:102,al:'Camila Ríos',car:'Turismo',needs:[3],ctx:'Quiero entender cómo es el día a día en hotelería.',disp:'Sábados por la mañana',period:2,st:'conf',m:5,slot:'Jue 15/10 · 18:00',ex:[],d:6}]}}
init();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const mn=id=>S.mentors.find(m=>m.id===id);const ntext=r=>r.needs.map(i=>NEEDS[i]).join(' · ');
function steps(r){let i={pend:0,pres:2,conf:3,done:4}[r.st];return `<div class="steps">${[0,1,2,3,4].map(x=>`<i class="${x<=i?'done':''}"></i>`).join('')}</div><div class="steps-label"><span>Enviado</span><span>Revisado</span><span>Asignado</span><span>Confirmado</span><span>Realizada</span></div>`}
function upload(label,key){return `<div class="upload"><b>${label}</b><div class="hint">PDF, DOC o imagen · máximo 10 MB</div><input type="file" data-file="${key}" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"><div class="file-name" id="file-${key}"></div></div>`}
function est(){let mine=S.reqs.filter(r=>r.al===ME.nombre);if(S.view==='form')return form();return `<div class="grid"><section><div class="card"><p class="eyebrow">Tu espacio</p><h2>Hola, Martina 👋</h2><p class="muted">Conectá con egresados de la UBP que ya recorrieron el camino que estás empezando.</p><div class="quick"><div><b>${mine.length}</b><span>pedidos activos</span></div><div><b>+120</b><span>egresados en la red</span></div><div><b>4,8</b><span>valoración promedio</span></div></div><button class="btn" style="margin-top:17px" data-a="go" data-v="form">Nueva mentoría <span aria-hidden="true">→</span></button></div>
<h2 style="margin:24px 0 10px">Mis mentorías</h2>${mine.length?mine.map(r=>`<div class="card request"><div class="row between"><h3>${esc(ntext(r))}</h3><span class="tag ${r.st==='conf'||r.st==='done'?'green':''}">${{pend:'En revisión',pres:'Presentado',conf:'Confirmada',done:'Realizada'}[r.st]}</span></div><div class="needs"><span class="tag">${esc(r.car)}</span><span class="tag">${PERIODS[r.period-1]}</span></div><p class="muted">${r.st==='conf'?`Confirmada con ${esc(mn(r.m).n)} · ${esc(r.slot)}`:'La UBP está buscando la mejor coincidencia para vos.'}</p>${steps(r)}${r.st==='conf'?`<button class="btn secondary small" data-a="done" data-id="${r.id}" style="margin-top:13px">Marcar como realizada</button>`:''}${r.st==='done'&&!r.rate?`<div style="margin-top:12px"><span class="muted">¿Cómo fue la sesión?</span><div class="row" style="margin-top:4px">${[1,2,3,4,5].map(n=>`<button class="btn ghost small" data-a="rate" data-id="${r.id}" data-n="${n}">${n} ★</button>`).join('')}</div></div>`:''}</div>`).join(''):'<div class="card muted">Todavía no pediste una mentoría.</div>'}</section><aside><div class="card"><p class="eyebrow">Antes de empezar</p><h3>Una buena mentoría empieza con foco</h3><p class="muted">Podés elegir varios objetivos y definir cuánto tiempo querés acompañamiento.</p><hr class="divider"><span class="tag green">Datos protegidos</span><p class="muted">Tu contacto se comparte solo cuando ambas partes aceptan.</p></div></aside></div>`}
function form(){let f=S.f||(S.f={needs:[],period:1,fmt:0,consent:false});return `<div class="card"><button class="btn secondary small" data-a="go" data-v="home">← Volver</button><p class="eyebrow" style="margin-top:20px">Paso 1 de 1</p><h2>Diseñá tu mentoría</h2><p class="muted">Contanos qué querés lograr y la UBP buscará la mejor coincidencia.</p><label class="field">Carrera</label><select id="car">${CAREERS.map(c=>`<option ${c===(S.fcar||ME.car)?'selected':''}>${c}</option>`).join('')}</select><label class="field">¿Qué querés trabajar? <span class="muted">(podés elegir varias)</span></label><div class="chips">${NEEDS.map((n,i)=>`<button class="chip" aria-pressed="${f.needs.includes(i)}" data-a="need" data-i="${i}">${n}</button>`).join('')}</div><label class="field" for="ctx">Contexto</label><textarea id="ctx" maxlength="400" placeholder="Ej.: estoy buscando mi primera práctica y quiero revisar mi portfolio.">${esc(S.ftx||'')}</textarea><label class="field" for="disp">Disponibilidad</label><input id="disp" type="text" value="${esc(S.fdisp||'Martes y jueves por la tarde')}"><label class="field">Período de acompañamiento</label><div class="chips">${PERIODS.map((p,i)=>`<button class="chip" aria-pressed="${f.period===i+1}" data-a="period" data-i="${i+1}">${p}</button>`).join('')}</div><p class="hint">La primera sesión se coordina dentro de los próximos 10 días hábiles.</p><label class="field">Formato</label><div class="chips">${['Videollamada de 30 min','Consulta escrita'].map((n,i)=>`<button class="chip" aria-pressed="${f.fmt===i}" data-a="fmt" data-i="${i}">${n}</button>`).join('')}</div>${upload('Adjuntar CV, portfolio u otro documento (opcional)','student')}<label class="check"><input id="cons" type="checkbox" ${f.consent?'checked':''}><span>Acepto que la UBP use mis datos para conectarme con un egresado. Mi contacto se comparte solo si ambos aceptamos.</span></label>${S.err?`<div class="error" role="alert">${S.err}</div>`:''}<button class="btn" data-a="send" style="margin-top:18px">Enviar solicitud</button></div>`}
function ficha(r,extra=''){return `<div class="card request"><div class="row between"><h3>${esc(ntext(r))}</h3><span class="tag">${esc(r.car)}</span></div><div class="kv"><span>Estudiante</span><span>${esc(r.al)}</span><span>Situación</span><span>${esc(r.ctx)}</span><span>Disponibilidad</span><span>${esc(r.disp)}</span><span>Período</span><span>${PERIODS[r.period-1]}</span></div>${extra}</div>`}
function incoming(r){return ficha(r,`<p class="muted">Elegí un horario para aceptar esta solicitud:</p>${SLOTS.map((s,i)=>`<label class="slot"><input type="radio" name="slot${r.id}" value="${s}" ${i===0?'checked':''}>${s}</label>`).join('')}<div class="row" style="margin-top:13px"><button class="btn" data-a="acc" data-id="${r.id}">Aceptar y confirmar</button><button class="btn secondary" data-a="dec" data-id="${r.id}">Ahora no puedo</button></div>`)}
function egr(){let m=mn(EGR),inc=S.reqs.filter(r=>r.st==='pres'&&r.m===EGR),ok=S.reqs.filter(r=>(r.st==='conf'||r.st==='done')&&r.m===EGR);if(S.view==='profile')return profile();let requests=inc.length?inc.map(incoming).join(''):'<div class="card muted">No tenés solicitudes pendientes. Cuando la UBP te presente una, va a aparecer acá.</div>';let confirmed=ok.length?`<h2 style="margin:24px 0 10px">Tus mentorías</h2>${ok.map(r=>`<div class="card"><div class="row between"><b>${esc(ntext(r))}</b><span class="tag green">${r.st==='done'?'Realizada':esc(r.slot)}</span></div><p class="muted">${esc(r.al)} · ${PERIODS[r.period-1]}</p></div>`).join('')}`:'';return `<div class="grid"><section><div class="card"><div class="profile"><div class="avatar">${m.n.split(' ').map(x=>x[0]).join('')}</div><div><h2>Hola, ${m.n.split(' ')[0]} 👋</h2><p>${esc(m.rol)} · ${esc(m.car)} · ${esc(m.lug)}</p></div></div><div class="row" style="margin-top:18px"><span class="tag ${m.on?'green':'amber'}">${m.on?'Disponible para mentorías':'En pausa'}</span><button class="btn secondary small" data-a="profile">Editar mi perfil</button><button class="btn ghost small" data-a="pausa">${m.on?'Pausar participación':'Volver a participar'}</button></div></div><h2 style="margin:24px 0 10px">Solicitudes para vos</h2>${requests}${confirmed}</section><aside><div class="card"><p class="eyebrow">Tu disponibilidad</p><h3>Definí tu límite mensual</h3><p class="muted">La plataforma nunca te va a asignar más sesiones de las que podés sostener.</p><label class="field" for="cupo">Máximo de sesiones por mes</label><select id="cupo" data-a="cupo">${[1,2,3].map(n=>`<option value="${n}" ${m.cupo===n?'selected':''}>${n} sesión${n>1?'es':''}</option>`).join('')}</select><p class="muted" style="margin-top:10px">Usaste ${m.us} de ${m.cupo} sesiones este mes.</p></div></aside></div>`}
function profile(){let p=S.profile;return `<div class="card"><button class="btn secondary small" data-a="profile">← Volver a mi panel</button><p class="eyebrow" style="margin-top:20px">Perfil público</p><h2>Mejorá tu perfil de egresado</h2><p class="muted">Un perfil completo ayuda a que los estudiantes te encuentren por experiencia y afinidad.</p><label class="field">Nombre y apellido</label><input id="pname" type="text" value="${esc(p.nombre)}"><label class="field">Carrera</label><select id="pcar">${CAREERS.map(c=>`<option ${c===p.car?'selected':''}>${c}</option>`).join('')}</select><label class="field">Rol actual</label><input id="prol" type="text" value="${esc(p.rol)}"><label class="field">Ubicación</label><input id="plug" type="text" value="${esc(p.lug)}"><label class="field">Sobre mí</label><textarea id="pbio" maxlength="240">${esc(p.bio)}</textarea><label class="field">Temas en los que podés ayudar</label><div class="chips">${NEEDS.map(n=>`<button class="chip" aria-pressed="${p.topics.includes(n)}" data-a="topic" data-topic="${esc(n)}">${n}</button>`).join('')}</div>${upload('Foto o presentación profesional (opcional)','profile')}<div class="row" style="margin-top:18px"><button class="btn" data-a="save-profile">Guardar cambios</button><button class="btn secondary" data-a="profile">Cancelar</button></div></div>`}
function score(r,m){return (r.car===m.car?3:AF[r.car]===AF[m.car]?2:0)+(r.needs.some(n=>m.t.includes(n))?1:0)}
function adm(){let R=S.reqs,act=S.mentors.filter(m=>m.on).length;return `<div class="metric"><div><b>${R.length}</b><span>Pedidos</span></div><div><b>${Math.round(R.filter(r=>r.st!=='pend').length/R.length*100)}%</b><span>Con respuesta</span></div><div><b>${act}</b><span>Mentores activos</span></div><div><b>4,8</b><span>Satisfacción</span></div></div><h2 style="margin:25px 0 10px">Pedidos a resolver</h2>${R.filter(r=>r.st==='pend'||r.st==='pres').map(r=>{if(r.st==='pres')return ficha(r,`<span class="tag amber">Presentado a ${esc(mn(r.m).n)}, esperando respuesta</span>`);let c=S.mentors.filter(m=>m.on&&m.us<m.cupo&&!r.ex.includes(m.id)).map(m=>({m,s:score(r,m)})).sort((a,b)=>b.s-a.s).slice(0,3);return ficha(r,`<p class="muted">Sugerencias de coincidencia:</p>${c.map(({m,s})=>`<div class="row between" style="border-top:1px solid var(--line);padding:10px 0"><span><b>${esc(m.n)}</b><br><small class="muted">${esc(m.rol)} · ${esc(m.car)}</small></span><button class="btn small" data-a="pres" data-id="${r.id}" data-m="${m.id}">Presentar</button></div>`).join('')}`)}).join('')||'<div class="card muted">No hay pedidos pendientes.</div>'}<h2 style="margin:25px 0 10px">Cobertura por carrera</h2><div class="card">${CAREERS.map(c=>{let n=S.mentors.filter(m=>m.car===c&&m.on).length;return `<div class="row" style="margin:9px 0"><span style="width:190px;font-size:13px">${c}</span><div class="bar"><i style="width:${Math.min(100,n*50)}%"></i></div><span class="tag ${n?'green':'amber'}">${n||'Sin'} mentor${n===1?'':'es'}</span></div>`}).join('')}</div>`}
function render(){let tabs=[['est','Estudiante','Pedí acompañamiento'],['egr','Egresado','Compartí experiencia'],['adm','Centro de Graduados','Gestioná la red']];document.getElementById('app').innerHTML=`<header class="site-header"><div class="brand"><div class="mark">UBP</div><div><h1>Puente UBP</h1><p>Mentorías que conectan experiencia y futuro</p></div></div><div class="header-context"><strong>Red de acompañamiento UBP</strong><span>Prototipo navegable · datos ficticios</span></div></header><div class="workspace"><aside class="sidebar"><p class="sidebar-label">Cambiar de espacio</p><nav class="side-nav" role="tablist">${tabs.map(([k,l,d])=>`<button role="tab" aria-selected="${S.role===k}" data-a="role" data-r="${k}">${l}<small>${d}</small></button>`).join('')}</nav><div class="sidebar-help"><strong>¿Cómo funciona?</strong>Elegí un espacio y completá las acciones desde un solo lugar.</div></aside><main class="main-content"><section class="page-intro"><div><p class="eyebrow">Puente UBP</p><h2>${S.role==='est'?'Tu próximo paso empieza con una conversación.':S.role==='egr'?'Tu experiencia puede abrir caminos.':'Una red que crece con cada conexión.'}</h2><p>${S.role==='est'?'Encontrá orientación real de egresados que ya recorrieron el camino que estás empezando.':S.role==='egr'?'Elegí cómo y cuánto querés acompañar a estudiantes de la comunidad UBP.':'Revisá solicitudes, encontrá coincidencias y cuidá la calidad de cada mentoría.'}</p></div><div class="page-actions"><button class="btn ghost small" data-a="reset">Reiniciar demo</button></div></section><div class="notice">✨ Explorá el prototipo con datos ficticios. Tu información de contacto solo se comparte cuando ambas partes aceptan.</div>${S.role==='est'?est():S.role==='egr'?egr():adm()}</main></div>`}
document.getElementById('app').addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,id=+b.dataset.id,r=S.reqs.find(x=>x.id===id);if(a==='role'){S.role=b.dataset.r;S.view='home'}else if(a==='go'){S.view=b.dataset.v;S.err='';if(S.view==='form')S.f={needs:[],period:1,fmt:0,consent:false}}else if(a==='need'){let i=+b.dataset.i,Sf=S.f;if(Sf.needs.includes(i))Sf.needs=Sf.needs.filter(x=>x!==i);else Sf.needs.push(i);save()}else if(a==='period'||a==='fmt'){S.f[a==='period'?'period':'fmt']=+b.dataset.i;save()}else if(a==='send'){save();let f=S.f;if(!f.needs.length)S.err='Elegí al menos un objetivo.';else if(!document.getElementById('ctx').value.trim())S.err='Contá brevemente tu situación.';else if(!f.consent)S.err='Aceptá el uso de tus datos para enviar el pedido.';else{S.reqs.push({id:S.nid++,al:ME.nombre,car:document.getElementById('car').value,needs:f.needs,ctx:document.getElementById('ctx').value.trim(),disp:document.getElementById('disp').value.trim()||'A coordinar',period:f.period,fmt:f.fmt,st:'pend',m:null,slot:null,ex:[],d:0,file:S.studentFile||''});S.view='home';S.err=''}}else if(a==='pres'){r.st='pres';r.m=+b.dataset.m}else if(a==='acc'){let v=document.querySelector(`input[name=slot${id}]:checked`);r.st='conf';r.slot=v?v.value:SLOTS[0];mn(r.m).us++}else if(a==='dec'){r.ex.push(r.m);r.m=null;r.st='pend'}else if(a==='done')r.st='done';else if(a==='rate'){r.rate=+b.dataset.n;S.rates.push(r.rate)}else if(a==='pausa'){mn(EGR).on=mn(EGR).on?0:1}else if(a==='profile'){S.view=S.view==='profile'?'home':'profile'}else if(a==='topic'){let p=S.profile;p.topics=p.topics.includes(b.dataset.topic)?p.topics.filter(x=>x!==b.dataset.topic):[...p.topics,b.dataset.topic]}else if(a==='save-profile'){let p=S.profile;p.nombre=document.getElementById('pname').value.trim()||p.nombre;p.car=document.getElementById('pcar').value;p.rol=document.getElementById('prol').value.trim();p.lug=document.getElementById('plug').value.trim();p.bio=document.getElementById('pbio').value.trim();let m=mn(EGR);m.n=p.nombre;m.car=p.car;m.rol=p.rol;m.lug=p.lug;S.view='home'}else if(a==='reset')init();render()});
document.getElementById('app').addEventListener('change',e=>{if(e.target.dataset.a==='cupo'){mn(EGR).cupo=+e.target.value;render()}if(e.target.dataset.file){let f=e.target.files[0];if(f){if(e.target.dataset.file==='profile')S.profile.file=f.name;else S.studentFile=f.name;let node=document.getElementById('file-'+e.target.dataset.file);if(node)node.textContent='✓ '+f.name}}});
function save(){let c=document.getElementById('cons'),x=document.getElementById('ctx'),k=document.getElementById('car'),d=document.getElementById('disp');if(c)S.f.consent=c.checked;if(x)S.ftx=x.value;if(k)S.fcar=k.value;if(d)S.fdisp=d.value}
render();
</script>
</body>
</html>
